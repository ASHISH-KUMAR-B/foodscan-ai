name: FoodScan AI CI

on:
  push:
    branches: [main, develop]

  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      # Client
      - name: Install Client
        working-directory: client
        run: npm install

      - name: Lint Client
        working-directory: client
        run: npm run lint

      - name: Build Client
        working-directory: client
        run: npm run build

      # Server
      - name: Install Server
        working-directory: server
        run: npm install

      - name: Lint Server
        working-directory: server
        run: npm run lint

      - name: Check Server
        working-directory: server
        run: node --check server.js